<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequential Timer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --gap-col: #95a5a6;
            --green: #28a745;
            --red: #dc3545;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        /* ── HEADER ── */
        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 25px 30px;
            text-align: center;
        }
        .header h1 { font-size: 2rem; font-weight: 700; margin-bottom: 4px; }
        .header p  { opacity: .9; font-size: 1rem; }

        /* ════════════════════════════════════════
           SETUP PANEL
        ════════════════════════════════════════ */
        .setup-panel { padding: 30px; }

        /* Templates row */
        .templates-row {
            display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px;
        }
        .tpl-btn {
            padding: 7px 15px;
            border: 2px solid #ddd; border-radius: 20px;
            background: white; cursor: pointer; font-size: .85rem;
            transition: all .2s;
        }
        .tpl-btn:hover { border-color: var(--primary); background: #f0f4ff; }

        /* Segment list */
        .seg-item {
            display: flex; align-items: center; gap: 10px;
            padding: 11px 14px; background: #f8f9fa;
            border-radius: 10px; margin-bottom: 7px;
            border: 2px solid transparent; transition: border-color .2s;
        }
        .seg-item:hover { border-color: #e0e0e0; }

        .seg-dot {
            width: 11px; height: 11px;
            border-radius: 50%; flex-shrink: 0;
        }

        .seg-name {
            flex: 1; border: none; background: transparent;
            font-size: .97rem; color: #333; font-family: inherit;
        }
        .seg-name:focus { outline: none; }

        .seg-dur {
            display: flex; align-items: center; gap: 4px;
            background: white; border: 2px solid #e0e0e0;
            border-radius: 8px; padding: 5px 9px;
        }
        .dur-input {
            width: 34px; border: none; text-align: center;
            font-size: .97rem; font-family: inherit; color: #333;
        }
        .dur-input:focus { outline: none; }
        .dur-sep { color: #aaa; font-weight: 700; }

        .type-badge {
            padding: 4px 11px;
            border: 2px solid; border-radius: 20px;
            cursor: pointer; font-size: .78rem; font-weight: 700;
            white-space: nowrap; transition: all .2s;
        }
        .type-timer { border-color: var(--primary); color: var(--primary); background: #f0f4ff; }
        .type-gap   { border-color: var(--gap-col);  color: var(--gap-col);  background: #f5f5f5; }

        .seg-del {
            background: none; border: none;
            color: #ccc; font-size: 1.1rem; cursor: pointer;
            transition: color .2s; line-height: 1; padding: 2px;
        }
        .seg-del:hover { color: var(--red); }

        /* Add buttons */
        .add-row { display: flex; gap: 10px; margin-bottom: 22px; }
        .add-btn {
            padding: 9px 18px; border: 2px dashed;
            border-radius: 8px; background: white;
            cursor: pointer; font-size: .9rem; transition: all .2s;
        }
        .add-timer-btn { border-color: var(--primary); color: var(--primary); }
        .add-timer-btn:hover { background: #f0f4ff; }
        .add-gap-btn { border-color: var(--gap-col); color: var(--gap-col); }
        .add-gap-btn:hover { background: #f5f5f5; }

        /* Sequence preview */
        .preview-bar {
            background: #f0f4ff; border-radius: 10px;
            padding: 14px 16px; margin-bottom: 6px;
            display: flex; align-items: center;
            flex-wrap: wrap; gap: 4px; min-height: 48px;
        }
        .prev-chip {
            padding: 5px 11px; border-radius: 13px;
            font-size: .78rem; font-weight: 700;
        }
        .prev-timer { background: var(--primary); color: white; }
        .prev-gap   { background: #ddd; color: #666; }
        .prev-arrow { color: #bbb; font-size: .75rem; }
        .total-line { font-size: .88rem; color: #888; margin-bottom: 18px; }

        /* Options */
        .opt-row { display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 22px; align-items: center; }
        .opt-grp { display: flex; align-items: center; gap: 8px; }
        .opt-label { font-size: .9rem; color: #555; }
        .toggle-btn {
            position: relative; width: 44px; height: 24px;
            background: #ddd; border-radius: 12px;
            cursor: pointer; border: none; transition: background .2s;
        }
        .toggle-btn.on { background: var(--primary); }
        .toggle-btn::after {
            content: ''; position: absolute;
            top: 3px; left: 3px;
            width: 18px; height: 18px;
            background: white; border-radius: 50%; transition: left .2s;
        }
        .toggle-btn.on::after { left: 23px; }

        /* Start button */
        .start-btn {
            width: 100%; padding: 17px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white; border: none; border-radius: 12px;
            font-size: 1.25rem; font-weight: 700; cursor: pointer;
            transition: all .3s;
        }
        .start-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102,126,234,.4);
        }
        .start-btn:disabled { opacity: .45; cursor: not-allowed; }

        /* ════════════════════════════════════════
           RUNNING PANEL
        ════════════════════════════════════════ */
        .running-panel { display: none; padding: 28px; }

        /* Sequence strip */
        .strip {
            display: flex; align-items: center; gap: 3px;
            flex-wrap: wrap; margin-bottom: 18px;
        }
        .strip-chip {
            padding: 4px 10px; border-radius: 11px;
            font-size: .73rem; font-weight: 700; transition: all .3s;
        }
        .sc-pending  { background: #f0f0f0; color: #bbb; }
        .sc-current  { background: var(--primary); color: white; transform: scale(1.06); }
        .sc-done     { background: #d4edda; color: #28a745; }
        .sc-gap-pend { background: #f0f0f0; color: #bbb; font-style: italic; }
        .sc-gap-cur  { background: #e0e0e0; color: #777; transform: scale(1.06); }
        .sc-gap-done { background: #f0f0f0; color: #bbb; }
        .strip-arr   { color: #ccc; font-size: .7rem; }

        /* ── MAIN DISPLAY ── */
        .timer-display {
            text-align: center;
            padding: 30px 20px 24px;
            background: #f5f5f5;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .seg-label {
            font-size: clamp(1.1rem, 3.5vw, 1.8rem);
            color: #777; font-weight: 600;
            text-transform: uppercase; letter-spacing: 3px;
            margin-bottom: 6px; transition: color .3s;
        }
        .seg-label.gap-style { color: #bbb; }

        /* THE DIGITS — big in normal mode, enormous in fullscreen */
        .digits {
            font-size: clamp(5.5rem, 22vw, 11rem);
            font-weight: 700; color: #1a1a1a;
            line-height: 1; font-variant-numeric: tabular-nums;
            font-family: 'Courier New', Courier, monospace;
            margin-bottom: 16px; transition: color .3s;
            letter-spacing: -2px;
        }
        .digits.gap-style { color: #aaa; }

        /* Progress */
        .prog-wrap { max-width: 520px; margin: 0 auto; }
        .prog-bg {
            height: 10px; background: #e0e0e0;
            border-radius: 5px; overflow: hidden;
        }
        .prog-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            border-radius: 5px; transition: width .6s ease;
        }
        .prog-fill.gap-style { background: linear-gradient(90deg, #aaa, #888); }
        .overall-prog {
            font-size: .85rem; color: #aaa; margin-top: 6px;
        }

        /* Quick adjust */
        .adjust-row {
            display: flex; justify-content: center;
            gap: 8px; margin-bottom: 18px; flex-wrap: wrap;
        }
        .adj-btn {
            padding: 8px 15px;
            border: 2px solid #e0e0e0; border-radius: 8px;
            background: white; color: #666; cursor: pointer;
            font-size: .88rem; transition: all .2s;
        }
        .adj-btn:hover { border-color: var(--primary); color: var(--primary); }

        /* Controls */
        .ctrl-row {
            display: flex; justify-content: center;
            gap: 10px; flex-wrap: wrap;
        }
        .ctrl {
            padding: 11px 22px; border: none; border-radius: 10px;
            font-size: .97rem; font-weight: 600; cursor: pointer; transition: all .2s;
        }
        .ctrl-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white; min-width: 110px;
        }
        .ctrl-primary:hover { transform: translateY(-1px); }
        .ctrl-secondary { background: #f0f0f0; color: #555; }
        .ctrl-secondary:hover { background: #e4e4e4; }
        .ctrl-edit { background: #fff5f5; color: var(--red); border: 2px solid #ffcccc; }
        .ctrl-edit:hover { background: #ffe0e0; }
        .ctrl-fs { background: #222; color: white; }
        .ctrl-fs:hover { background: #111; }

        .kb-hint {
            text-align: center; color: #ccc; font-size: .78rem; margin-top: 14px;
        }

        /* ════════════════════════════════════════
           COMPLETE PANEL
        ════════════════════════════════════════ */
        .complete-panel {
            display: none; padding: 50px 30px; text-align: center;
        }
        .cmp-icon  { font-size: 4rem; margin-bottom: 16px; }
        .cmp-title { font-size: 2.2rem; font-weight: 700; color: #333; margin-bottom: 8px; }
        .cmp-sub   { font-size: 1.05rem; color: #888; margin-bottom: 32px; }
        .cmp-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }

        /* ════════════════════════════════════════
           FULLSCREEN
        ════════════════════════════════════════ */
        body.fs .container {
            max-width: none; border-radius: 0;
            min-height: 100vh; display: flex; flex-direction: column;
        }
        body.fs { padding: 0; overflow: hidden; }
        body.fs .header { display: none; }
        body.fs .setup-panel { display: none !important; }

        /* Running in fullscreen */
        body.fs .running-panel {
            flex: 1; display: flex !important;
            flex-direction: column; justify-content: center; align-items: center;
            padding: 30px; background: #0d0d0d;
        }
        body.fs .strip       { display: none; }
        body.fs .adjust-row  { display: none; }
        body.fs .kb-hint     { color: #333; }

        body.fs .timer-display {
            background: transparent; padding: 0; width: 100%;
        }
        body.fs .seg-label {
            font-size: clamp(1.8rem, 6vw, 5rem);
            color: #666;
        }
        body.fs .seg-label.gap-style { color: #444; }

        /* ★ THE MAIN FIX — truly enormous in fullscreen ★ */
        body.fs .digits {
            font-size: min(40vw, 50vh);
            color: white;
            letter-spacing: -4px;
        }
        body.fs .digits.gap-style { color: #444; }

        body.fs .prog-wrap { max-width: 75%; }
        body.fs .prog-bg   { height: 14px; }
        body.fs .overall-prog { color: #444; font-size: .95rem; }

        body.fs .ctrl-row { margin-top: 28px; }
        body.fs .ctrl { padding: 14px 28px; font-size: 1.05rem; }
        body.fs .ctrl-secondary { background: rgba(255,255,255,.1); color: #999; }
        body.fs .ctrl-secondary:hover { background: rgba(255,255,255,.18); }
        body.fs .ctrl-edit  { background: rgba(220,53,69,.1); color: #ff6b6b; border-color: rgba(220,53,69,.3); }
        body.fs .ctrl-edit:hover { background: rgba(220,53,69,.2); }
        body.fs .ctrl-fs    { background: rgba(255,255,255,.1); color: #999; }
        body.fs .ctrl-fs:hover { background: rgba(255,255,255,.18); }

        /* Complete in fullscreen */
        body.fs .complete-panel {
            flex: 1; display: flex !important;
            flex-direction: column; justify-content: center; align-items: center;
            background: #0d0d0d;
        }
        body.fs .cmp-icon  { font-size: 6rem; }
        body.fs .cmp-title { color: white; font-size: 3.5rem; }
        body.fs .cmp-sub   { color: #666; font-size: 1.3rem; }
        body.fs .ctrl-secondary { background: rgba(255,255,255,.1); color: #999; }

        /* Sound fab */
        .sound-fab {
            position: fixed; bottom: 18px; right: 18px;
            font-size: 1.3rem; cursor: pointer;
            opacity: .45; transition: opacity .2s;
            z-index: 999; user-select: none;
        }
        .sound-fab:hover { opacity: 1; }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            body { padding: 0; }
            .container { border-radius: 0; }
            .setup-panel, .running-panel { padding: 18px; }
            .ctrl-row { gap: 7px; }
            .ctrl { padding: 9px 14px; font-size: .88rem; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- ── HEADER ── -->
    <div class="header">
        <h1>⏱ Sequential Timer</h1>
        <p>Build and run timed sequences for any activity</p>
    </div>

    <!-- ════════════════════════════════════════
         SETUP PANEL
    ════════════════════════════════════════ -->
    <div class="setup-panel" id="setupPanel">

        <div style="font-size:.8rem;color:#bbb;text-transform:uppercase;letter-spacing:1px;margin-bottom:9px;">Quick templates</div>
        <div class="templates-row">
            <button class="tpl-btn" onclick="loadTpl('class')">🏫 Class Activity</button>
            <button class="tpl-btn" onclick="loadTpl('pomodoro')">🍅 Pomodoro</button>
            <button class="tpl-btn" onclick="loadTpl('workout')">💪 Workout</button>
            <button class="tpl-btn" onclick="loadTpl('meeting')">📋 Meeting</button>
            <button class="tpl-btn" onclick="loadTpl('blank')">＋ Blank</button>
        </div>

        <div id="segList"></div>

        <div class="add-row">
            <button class="add-btn add-timer-btn" onclick="addSeg('timer')">＋ Add Timer</button>
            <button class="add-btn add-gap-btn"   onclick="addSeg('gap')">＋ Add Gap</button>
        </div>

        <div class="preview-bar" id="previewBar">
            <span style="color:#ccc;font-size:.9rem;">Add timers above to preview your sequence…</span>
        </div>
        <div class="total-line" id="totalLine"></div>

        <div class="opt-row">
            <div class="opt-grp">
                <button class="toggle-btn" id="togSound" onclick="toggleOpt('sound')"></button>
                <span class="opt-label">🔔 Sound alerts</span>
            </div>
            <div class="opt-grp">
                <button class="toggle-btn on" id="togCdown" onclick="toggleOpt('cdown')"></button>
                <span class="opt-label">🔢 3-2-1 beeps</span>
            </div>
            <div class="opt-grp">
                <button class="toggle-btn on" id="togLoop" onclick="toggleOpt('loop')"></button>
                <span class="opt-label">🔁 Loop sequence</span>
            </div>
        </div>

        <button class="start-btn" id="startBtn" onclick="startSeq()" disabled>▶ Start Sequence</button>
    </div>

    <!-- ════════════════════════════════════════
         RUNNING PANEL
    ════════════════════════════════════════ -->
    <div class="running-panel" id="runPanel">

        <div class="strip" id="strip"></div>

        <div class="timer-display" id="timerDisplay">
            <div class="seg-label" id="segLabel">READY</div>
            <div class="digits"    id="digits">00:00</div>
            <div class="prog-wrap">
                <div class="prog-bg">
                    <div class="prog-fill" id="progFill" style="width:0%"></div>
                </div>
                <div class="overall-prog" id="overallProg"></div>
            </div>
        </div>

        <div class="adjust-row" id="adjRow">
            <button class="adj-btn" onclick="adj(-60)">−1 min</button>
            <button class="adj-btn" onclick="adj(-30)">−30 s</button>
            <button class="adj-btn" onclick="adj(30)">+30 s</button>
            <button class="adj-btn" onclick="adj(60)">+1 min</button>
        </div>

        <div class="ctrl-row">
            <button class="ctrl ctrl-secondary" onclick="restartSeq()">↺ Restart</button>
            <button class="ctrl ctrl-primary"   id="pauseBtn" onclick="togglePause()">⏸ Pause</button>
            <button class="ctrl ctrl-secondary" onclick="skipSeg()">⏭ Skip</button>
            <button class="ctrl ctrl-edit"      onclick="backToSetup()">✕ Edit</button>
            <button class="ctrl ctrl-fs"        onclick="toggleFS()" id="fsBtn">⛶ Fullscreen</button>
        </div>

        <div class="kb-hint">Space = pause · ← −30 s · → +30 s · F = fullscreen · Esc = exit fullscreen</div>
    </div>

    <!-- ════════════════════════════════════════
         COMPLETE PANEL
    ════════════════════════════════════════ -->
    <div class="complete-panel" id="cmpPanel">
        <div class="cmp-icon">🎉</div>
        <div class="cmp-title">Sequence Complete!</div>
        <div class="cmp-sub" id="cmpSub"></div>
        <div class="cmp-actions">
            <button class="ctrl ctrl-primary"   onclick="restartSeq()">↺ Run Again</button>
            <button class="ctrl ctrl-secondary" onclick="backToSetup()">✎ Edit Sequence</button>
        </div>
    </div>

</div><!-- /container -->

<div class="sound-fab" id="soundFab" onclick="toggleOpt('sound')" title="Toggle sound">🔕</div>

<script>
/* ══════════════════════════════════════════════
   DATA
══════════════════════════════════════════════ */
let segs = [];
let uid  = 1;

const opts = { sound: false, cdown: true, loop: true };

const run = {
    active: false, paused: false,
    idx: 0, rem: 0, dur: 0,
    totalDur: 0, totalElapsed: 0,
    tick: null
};

let inFS = false;
let audioCtx = null;

/* ══════════════════════════════════════════════
   AUDIO
══════════════════════════════════════════════ */
function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
}

function beep(freq=880, dur=.15, vol=.3, type='sine') {
    if (!opts.sound) return;
    try {
        const c = getCtx();
        const o = c.createOscillator();
        const g = c.createGain();
        o.connect(g); g.connect(c.destination);
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(vol, c.currentTime);
        g.gain.exponentialRampToValueAtTime(.001, c.currentTime + dur);
        o.start(c.currentTime); o.stop(c.currentTime + dur);
    } catch(e) {}
}

function playTransition() { beep(660,.12); setTimeout(()=>beep(880,.18), 140); }
function playComplete()    { beep(523,.2); setTimeout(()=>beep(659,.2),200); setTimeout(()=>beep(784,.4),400); }
function playCountdown(n)  { if (opts.cdown) beep(n===1?1046:880, .1, .25); }

/* ══════════════════════════════════════════════
   SEGMENT MANAGEMENT
══════════════════════════════════════════════ */
function addSeg(type, name, mins, secs) {
    const def = type==='gap'
        ? {name:'Gap', mins:0, secs:5}
        : {name:'Timer', mins:1, secs:0};
    segs.push({
        id: uid++, type,
        name: name !== undefined ? name : def.name,
        mins: mins !== undefined ? mins : def.mins,
        secs: secs !== undefined ? secs : def.secs
    });
    renderSegs(); renderPreview();
}

function removeSeg(id) {
    segs = segs.filter(s=>s.id!==id);
    renderSegs(); renderPreview();
}

function updateSeg(id, field, val) {
    const s = segs.find(s=>s.id===id);
    if (!s) return;
    if (field==='mins') s.mins = Math.max(0, Math.min(99, parseInt(val)||0));
    else if (field==='secs') s.secs = Math.max(0, Math.min(59, parseInt(val)||0));
    else s[field] = val;
    renderPreview();
}

function flipType(id) {
    const s = segs.find(s=>s.id===id);
    if (!s) return;
    s.type = s.type==='timer' ? 'gap' : 'timer';
    renderSegs(); renderPreview();
}

function dur(s) { return (parseInt(s.mins)||0)*60 + (parseInt(s.secs)||0); }
function totalDur() { return segs.reduce((t,s)=>t+dur(s),0); }

function esc(str) {
    return String(str)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderSegs() {
    const el = document.getElementById('segList');
    if (!segs.length) {
        el.innerHTML = `<div style="text-align:center;color:#bbb;padding:18px 0;
            border:2px dashed #e0e0e0;border-radius:10px;margin-bottom:10px;">
            No segments yet — add one below!</div>`;
        document.getElementById('startBtn').disabled = true;
        return;
    }
    el.innerHTML = segs.map(s => `
        <div class="seg-item" id="si-${s.id}">
            <div class="seg-dot" style="background:${s.type==='timer'?'#667eea':'#aaa'}"></div>
            <input class="seg-name" value="${esc(s.name)}"
                onchange="updateSeg(${s.id},'name',this.value)"
                placeholder="${s.type==='gap'?'Gap label':'Timer name'}">
            <div class="seg-dur">
                <input class="dur-input" type="number" min="0" max="99"
                    value="${s.mins}"
                    onchange="updateSeg(${s.id},'mins',this.value)"
                    oninput="updateSeg(${s.id},'mins',this.value)">
                <span class="dur-sep">:</span>
                <input class="dur-input" type="number" min="0" max="59"
                    value="${String(s.secs).padStart(2,'0')}"
                    onchange="updateSeg(${s.id},'secs',this.value)"
                    oninput="updateSeg(${s.id},'secs',this.value)">
            </div>
            <button class="type-badge ${s.type==='timer'?'type-timer':'type-gap'}"
                onclick="flipType(${s.id})">
                ${s.type==='timer'?'⏱ Timer':'⏸ Gap'}
            </button>
            <button class="seg-del" onclick="removeSeg(${s.id})" title="Delete">✕</button>
        </div>
    `).join('');
    document.getElementById('startBtn').disabled = !segs.some(s=>dur(s)>0);
}

function renderPreview() {
    const bar = document.getElementById('previewBar');
    const tl  = document.getElementById('totalLine');
    if (!segs.length) {
        bar.innerHTML = `<span style="color:#ccc;font-size:.9rem;">Add timers above to preview your sequence…</span>`;
        tl.textContent = '';
        return;
    }
    const chips = segs.map(s =>
        `<span class="prev-chip ${s.type==='timer'?'prev-timer':'prev-gap'}">${esc(s.name)}: ${fmt(dur(s))}</span>`
    ).join('<span class="prev-arrow"> → </span>');
    bar.innerHTML = chips;
    tl.textContent = `Total: ${fmt(totalDur())}`;
}

/* ══════════════════════════════════════════════
   TEMPLATES
══════════════════════════════════════════════ */
const TPLS = {
    class: [
        {type:'timer',name:'Introduction',   mins:2,  secs:0},
        {type:'gap',  name:'Transition',     mins:0,  secs:5},
        {type:'timer',name:'Group Work',     mins:6,  secs:0},
        {type:'gap',  name:'Transition',     mins:0,  secs:5},
        {type:'timer',name:'Presentations',  mins:5,  secs:0},
        {type:'gap',  name:'Transition',     mins:0,  secs:5},
        {type:'timer',name:'Wrap-up',        mins:2,  secs:0},
    ],
    pomodoro: [
        {type:'timer',name:'Focus',          mins:25, secs:0},
        {type:'gap',  name:'Short Break',    mins:5,  secs:0},
        {type:'timer',name:'Focus',          mins:25, secs:0},
        {type:'gap',  name:'Short Break',    mins:5,  secs:0},
        {type:'timer',name:'Focus',          mins:25, secs:0},
        {type:'gap',  name:'Long Break',     mins:15, secs:0},
    ],
    workout: [
        {type:'timer',name:'Warm Up',        mins:5,  secs:0},
        {type:'gap',  name:'Rest',           mins:0,  secs:30},
        {type:'timer',name:'Set 1',          mins:1,  secs:0},
        {type:'gap',  name:'Rest',           mins:0,  secs:30},
        {type:'timer',name:'Set 2',          mins:1,  secs:0},
        {type:'gap',  name:'Rest',           mins:0,  secs:30},
        {type:'timer',name:'Cool Down',      mins:3,  secs:0},
    ],
    meeting: [
        {type:'timer',name:'Agenda Review',  mins:3,  secs:0},
        {type:'gap',  name:'',               mins:0,  secs:5},
        {type:'timer',name:'Main Discussion',mins:20, secs:0},
        {type:'gap',  name:'',               mins:0,  secs:5},
        {type:'timer',name:'Action Items',   mins:5,  secs:0},
    ],
    blank: []
};

function loadTpl(name) {
    segs = []; uid = 1;
    (TPLS[name]||[]).forEach(t => segs.push({id:uid++,...t}));
    renderSegs(); renderPreview();
}

/* ══════════════════════════════════════════════
   TIMER ENGINE
══════════════════════════════════════════════ */
function startSeq() {
    if (!segs.length) return;
    run.active = true; run.paused = false;
    run.idx = 0; run.totalElapsed = 0;
    run.totalDur = totalDur();

    show('runPanel');
    renderStrip();
    startSeg(0);
}

function startSeg(idx) {
    if (idx >= segs.length) { onComplete(); return; }

    const s = segs[idx];
    const d = dur(s);
    run.idx = idx; run.rem = d; run.dur = d;

    if (d === 0) { run.totalElapsed += 0; startSeg(idx+1); return; }

    updateRunDisplay();
    renderStrip();
    clearInterval(run.tick);
    run.tick = setInterval(tick, 1000);
}

function tick() {
    if (run.paused) return;
    run.rem--; run.totalElapsed++;

    // Countdown beeps
    if (opts.sound && opts.cdown && run.rem > 0 && run.rem <= 3) playCountdown(run.rem);

    if (run.rem <= 0) {
        clearInterval(run.tick); run.tick = null;
        playTransition();
        setTimeout(()=>startSeg(run.idx+1), 250);
        return;
    }
    updateRunDisplay();
}

function updateRunDisplay() {
    const s = segs[run.idx];
    if (!s) return;
    const isGap = s.type === 'gap';

    const lbl = document.getElementById('segLabel');
    lbl.textContent  = s.name || (isGap ? 'GAP' : 'TIMER');
    lbl.className    = 'seg-label' + (isGap ? ' gap-style' : '');

    const dig = document.getElementById('digits');
    dig.textContent = fmt(run.rem);
    dig.className   = 'digits' + (isGap ? ' gap-style' : '');

    const pct = run.dur > 0 ? ((run.dur - run.rem) / run.dur) * 100 : 100;
    const fill = document.getElementById('progFill');
    fill.style.width = pct + '%';
    fill.className   = 'prog-fill' + (isGap ? ' gap-style' : '');

    const oPct = run.totalDur > 0 ? Math.round(run.totalElapsed / run.totalDur * 100) : 0;
    document.getElementById('overallProg').textContent =
        `Segment ${run.idx+1} of ${segs.length}  ·  ${oPct}% complete`;
}

function renderStrip() {
    const strip = document.getElementById('strip');
    strip.innerHTML = segs.map((s,i) => {
        let cls;
        if      (i < run.idx)  cls = s.type==='timer' ? 'sc-done'     : 'sc-gap-done';
        else if (i === run.idx) cls = s.type==='timer' ? 'sc-current'  : 'sc-gap-cur';
        else                   cls = s.type==='timer' ? 'sc-pending'  : 'sc-gap-pend';
        return `<span class="strip-chip ${cls}">${esc(s.name||'…')}</span>`;
    }).join('<span class="strip-arr">→</span>');
}

/* ── ON COMPLETE ── */
function onComplete() {
    clearInterval(run.tick); run.tick = null; run.active = false;
    playComplete();

    if (opts.loop) {
        // Loop: restart automatically after a brief pause
        show('runPanel');
        document.getElementById('segLabel').textContent = 'COMPLETE — restarting…';
        document.getElementById('digits').textContent   = '';
        setTimeout(() => { restartSeq(); }, 2000);
    } else {
        // Show complete panel — STAY in fullscreen
        show('cmpPanel');
        const t = fmt(totalDur());
        document.getElementById('cmpSub').textContent =
            `All ${segs.length} segments done · Total time: ${t}`;
    }
}

/* ── CONTROLS ── */
function togglePause() {
    run.paused = !run.paused;
    const btn = document.getElementById('pauseBtn');
    btn.textContent       = run.paused ? '▶ Resume' : '⏸ Pause';
    btn.style.background  = run.paused
        ? 'linear-gradient(135deg,#28a745,#20c997)'
        : 'linear-gradient(135deg,#667eea,#764ba2)';
}

function skipSeg() {
    clearInterval(run.tick);
    run.totalElapsed += run.rem;
    run.rem = 0;
    startSeg(run.idx + 1);
}

function adj(secs) {
    run.rem = Math.max(1, run.rem + secs);
    if (run.rem > run.dur) run.dur = run.rem;
    updateRunDisplay();
}

function restartSeq() {
    clearInterval(run.tick); run.tick = null;

    // Reset pause button
    const pb = document.getElementById('pauseBtn');
    pb.textContent      = '⏸ Pause';
    pb.style.background = 'linear-gradient(135deg,#667eea,#764ba2)';

    run.active = true; run.paused = false;
    run.idx = 0; run.totalElapsed = 0;
    run.totalDur = totalDur();

    show('runPanel');
    renderStrip();
    startSeg(0);
}

function backToSetup() {
    clearInterval(run.tick); run.tick = null; run.active = false;
    if (inFS) exitFS();
    show('setupPanel');
}

/* ══════════════════════════════════════════════
   FULLSCREEN
══════════════════════════════════════════════ */
function toggleFS() { inFS ? exitFS() : enterFS(); }

function enterFS() {
    (document.documentElement.requestFullscreen
     || document.documentElement.webkitRequestFullscreen
     || document.documentElement.mozRequestFullScreen
    )?.call(document.documentElement).catch(()=>{});
    document.body.classList.add('fs');
    inFS = true;
    document.getElementById('fsBtn').textContent = '✕ Exit Fullscreen';
}

function exitFS() {
    if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    document.body.classList.remove('fs');
    inFS = false;
    document.getElementById('fsBtn').textContent = '⛶ Fullscreen';
}

// Handle native Esc key exiting fullscreen
document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && inFS) {
        document.body.classList.remove('fs');
        inFS = false;
        document.getElementById('fsBtn').textContent = '⛶ Fullscreen';
    }
});

/* ══════════════════════════════════════════════
   OPTIONS
══════════════════════════════════════════════ */
function toggleOpt(key) {
    opts[key] = !opts[key];
    const id = {sound:'togSound', cdown:'togCdown', loop:'togLoop'}[key];
    const el = document.getElementById(id);
    if (el) el.className = 'toggle-btn' + (opts[key]?' on':'');
    document.getElementById('soundFab').textContent = opts.sound ? '🔔' : '🔕';
}

/* ══════════════════════════════════════════════
   KEYBOARD SHORTCUTS
══════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
    if (!run.active) return;
    if (e.target.tagName==='INPUT') return;
    switch(e.code) {
        case 'Space':       e.preventDefault(); togglePause(); break;
        case 'ArrowLeft':   e.preventDefault(); adj(-30); break;
        case 'ArrowRight':  e.preventDefault(); adj(30);  break;
        case 'KeyF':        e.preventDefault(); toggleFS(); break;
        case 'Escape':      if (inFS) { exitFS(); e.preventDefault(); } break;
    }
});

/* ══════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════ */
function fmt(secs) {
    secs = Math.max(0, Math.round(secs));
    const h = Math.floor(secs/3600);
    const m = Math.floor((secs%3600)/60);
    const s = secs % 60;
    if (h > 0) return `${h}:${pad(m)}:${pad(s)}`;
    return `${pad(m)}:${pad(s)}`;
}
function pad(n) { return String(n).padStart(2,'0'); }

function show(id) {
    ['setupPanel','runPanel','cmpPanel'].forEach(p => {
        document.getElementById(p).style.display = p===id ? 'block' : 'none';
    });
}

/* ══════════════════════════════════════════════
   INIT
══════════════════════════════════════════════ */
loadTpl('blank');
</script>
